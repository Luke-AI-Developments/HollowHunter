plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shadowhunter.gpshealthbridge'
    compileSdk 34

    defaultConfig {
        // Health Connect requires API 26+.
        minSdk 26
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Godot's Android library. Match the version string to your installed
    // Godot engine (Editor > About shows it). If Maven Central doesn't carry
    // your exact version, fall back to the local AAR method described in
    // native/android/README.md instead of this line.
    implementation "org.godotengine:godot:4.3.0.stable"

    implementation "com.google.android.gms:play-services-location:21.3.0"

    // Health Connect client. Alpha API as of writing -- check
    // https://developer.android.com/health-and-fitness/guides/health-connect
    // for the current version before building.
    implementation "androidx.health.connect:connect-client:1.1.0-alpha07"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.0"

    def coroutines_version = "1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
}
